name: Build, Test, and Visual QA

on:
  push:
    branches: [redesign/premium-conversion, main]
  pull_request:
    branches: [redesign/premium-conversion, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: sh deploy-surge.sh

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start local preview server
        run: python3 -m http.server 8765 --directory dist &
        sleep 2

      - name: Run Playwright browser tests
        run: npx playwright test

      - name: Run existing regression tests
        run: |
          python3 tests/directory-regression.py
          node tests/runtime-smoke.js

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: tests/results/
          retention-days: 7
