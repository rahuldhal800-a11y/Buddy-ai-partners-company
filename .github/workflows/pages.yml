name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static site (runs preflight validation)
        run: sh deploy-surge.sh

      - name: Remove Surge CNAME if present
        run: rm -f dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow (Bing) about the fresh deployment
        run: |
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" --get \
            --data-urlencode "url=https://rahuldhal800-a11y.github.io/Buddy-ai-partners-company/" \
            --data-urlencode "key=5b44e100446fef7d326fe15d85f5d157" \
            "https://api.indexnow.org/indexnow" || true
