<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t"><title id="t">AI agents sandbox concept visual</title><rect width="900" height="560" rx="26" fill="#060b17"/><rect x="24" y="24" width="852" height="512" rx="16" fill="#081327" stroke="#38bdf8" stroke-opacity=".4"/><rect x="24" y="24" width="852" height="54" rx="16" fill="#0e1b32"/><circle cx="52" cy="51" r="6" fill="#fb7185"/><circle cx="74" cy="51" r="6" fill="#fbbf24"/><circle cx="96" cy="51" r="6" fill="#34d399"/><text x="128" y="57" fill="#dbeafe" font-family="monospace" font-size="16">AI-AGENTS-SANDBOX / experiments</text><g font-family="monospace" font-size="15"><text x="55" y="125" fill="#64748b">01</text><text x="92" y="125" fill="#7dd3fc">from agents import planner, tools</text><text x="55" y="165" fill="#64748b">02</text><text x="92" y="165" fill="#c4b5fd">task = define_goal(user_request)</text><text x="55" y="205" fill="#64748b">03</text><text x="92" y="205" fill="#86efac">plan = planner.create(task)</text><text x="55" y="245" fill="#64748b">04</text><text x="92" y="245" fill="#fcd34d">result = tools.run_with_limits(plan)</text><text x="55" y="285" fill="#64748b">05</text><text x="92" y="285" fill="#7dd3fc">review(result)</text></g><rect x="55" y="340" width="790" height="140" rx="12" fill="#0d1a30" stroke="#1e3a5f"/><text x="80" y="380" fill="#e0f2fe" font-family="Arial,sans-serif" font-size="18" font-weight="700">Experiment with agent patterns</text><text x="80" y="413" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Public repository · inspect code and README for exact scope.</text><g fill="#38bdf8"><circle cx="810" cy="370" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle><circle cx="790" cy="390" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="2.6s" repeatCount="indefinite"/></circle></g></svg>