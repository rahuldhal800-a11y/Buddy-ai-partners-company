  <style>
    /* ================================================================
       BUDDY AI PARTNERS — Sovereign luxury design system v2
       Obsidian × Imperial Gold × Emerald Verification
       ================================================================ */
    :root {
      --obsidian: #040A16;
      --navy-1: #081427;
      --navy-2: #0E203C;
      --ink: #F8FAFC;
      --body: #C9D4E3;
      --muted: #8B9BB0;
      --gold: #D4AF37;
      --gold-soft: #F6E27A;
      --gold-deep: #785603;
      --crimson: #C91A1A;
      --emerald: #0E873D;
      --mint: #7DE2C3;
      --sky: #38BDF8;
      --sky-soft: #7FD4FC;
      --sky-deep: #1D4ED8;
      --amber: #E8C35A;
      --line: rgba(56, 189, 248, .14);
      --line-strong: rgba(56, 189, 248, .35);
      --card-bg: linear-gradient(160deg, rgba(14, 32, 60, .55), rgba(4, 10, 22, .72));
      --card-shadow: 0 18px 44px rgba(2, 6, 16, .45);
      --ease: cubic-bezier(.25, 1, .5, 1);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-ui: 'Outfit', system-ui, sans-serif;
      --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    [id] { scroll-margin-top: 5.4rem; }
    [hidden] { display: none !important; }
    body {
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.65;
      letter-spacing: .01em;
      background: var(--obsidian);
      color: var(--body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body.portal-open { overflow: hidden; }
    img { max-width: 100%; display: block; }
    a { color: var(--sky); text-decoration: none; }
    a:hover { color: var(--sky-soft); }
    button { font-family: inherit; cursor: pointer; }
    ::selection { background: rgba(56,189,248,.85); color: #04070f; }
    :focus-visible { outline: 2px solid var(--sky); outline-offset: 3px; border-radius: 4px; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #050b18; }
    ::-webkit-scrollbar-thumb { background: #16294a; border-radius: 8px; border: 2px solid #050b18; }
    ::-webkit-scrollbar-thumb:hover { background: #22395f; }
    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    noscript + .cinematic { display: none !important; }

    /* ---------- Typography ---------- */
    h1, h2, h3 { font-family: var(--font-display); color: var(--ink); font-weight: 600; line-height: 1.12; letter-spacing: .002em; text-wrap: balance; }
    .display-xl { font-family: var(--font-display); font-size: clamp(2.35rem, 6.2vw, 4.35rem); line-height: 1.05; letter-spacing: .001em; }
    .display-l { font-family: var(--font-display); font-size: clamp(1.9rem, 4.4vw, 3.1rem); line-height: 1.08; }
    .h3 { font-family: var(--font-display); font-size: clamp(1.28rem, 2.4vw, 1.7rem); line-height: 1.2; }
    .h4 { font-family: var(--font-ui); font-size: .95rem; font-weight: 600; color: var(--ink); letter-spacing: .015em; }
    .gold-i { font-family: var(--font-display); font-style: italic; font-weight: 500; background: linear-gradient(100deg, #FFFFFF 0%, #BFE3FF 30%, var(--sky) 60%, var(--sky-deep) 100%); -webkit-background-clip: text; background-clip: text; color: #9FD8FF; -webkit-text-fill-color: transparent; }
    .lead { font-size: clamp(1rem, 1.6vw, 1.16rem); color: var(--body); line-height: 1.7; }
    .t-gold { color: var(--gold-soft); } .t-emerald { color: #34d399; } .t-crimson { color: #f28b82; }
    .t-mint { color: var(--mint); } .t-white { color: var(--ink); } .t-muted { color: var(--muted); }
    .mono { font-family: var(--font-mono); letter-spacing: .02em; }
    .small { font-size: .8rem; }
    .xsmall { font-size: .72rem; }
    .center { text-align: center; }

    .eyebrow {
      display: inline-flex; align-items: center; gap: .65rem;
      font-family: var(--font-ui); font-size: .68rem; font-weight: 700;
      letter-spacing: .24em; text-transform: uppercase; color: var(--sky);
    }
    .eyebrow::before { content: ""; width: 34px; height: 1px; background: linear-gradient(90deg, transparent, var(--sky)); }
    .eyebrow.center::after { content: ""; width: 34px; height: 1px; background: linear-gradient(90deg, var(--sky), transparent); }
    .hairline { display: flex; align-items: center; gap: 1rem; margin: 0 auto; width: 100%; }
    .hairline::before, .hairline::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line-strong), transparent); }
    .hairline span { color: var(--sky-soft); font-size: .7rem; letter-spacing: .3em; }

    /* ---------- Layout ---------- */
    .shell { width: min(1160px, 100% - clamp(2.2rem, 8vw, 5rem)); margin-inline: auto; }
    .shell-wide { width: min(1320px, 100% - clamp(2.2rem, 8vw, 5rem)); margin-inline: auto; }
    .sec { padding-block: clamp(3.4rem, 7vw, 5.6rem); }
    .sec-sm { padding-block: clamp(1.6rem, 3.5vw, 2.6rem); }
    .sec-head { margin-bottom: clamp(1.6rem, 3.5vw, 2.6rem); max-width: 46rem; }
    .sec-head.center { margin-inline: auto; text-align: center; }
    .sec-head p { margin-top: .6rem; }
    .grid-2 { display: grid; gap: clamp(1rem, 2.4vw, 1.6rem); grid-template-columns: 1fr; }
    .grid-3 { display: grid; gap: clamp(1rem, 2.4vw, 1.6rem); grid-template-columns: 1fr; }
    .grid-4 { display: grid; gap: clamp(1rem, 2.4vw, 1.5rem); grid-template-columns: 1fr 1fr; }
    @media (min-width: 720px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
      .grid-4 { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 900px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
    }
    .flex { display: flex; }
    .between { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }
    .iwrap { gap: .6rem; align-items: flex-start; }
    .hide-d { } /* mobile-only */
    @media (min-width: 1120px) { .hide-d { display: none !important; } }
    .hide-m { display: none !important; }
    @media (min-width: 1120px) { .hide-m { display: flex !important; } }

    /* ---------- Cards & surfaces ---------- */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(1.15rem, 2.6vw, 1.7rem);
      box-shadow: var(--card-shadow);
      position: relative;
      transition: transform .5s var(--ease), border-color .5s var(--ease), box-shadow .5s var(--ease);
    }
    .card-hover:hover {
      transform: translateY(-4px);
      border-color: var(--line-strong);
      box-shadow: 0 24px 56px rgba(2, 6, 16, .6), 0 0 0 1px rgba(212, 175, 55, .06);
    }
    .spotlight-card { overflow: hidden; }
    .spotlight-card::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0;
      transition: opacity .45s var(--ease);
      background: radial-gradient(240px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(212, 175, 55, .09), transparent 65%);
      pointer-events: none;
    }
    .spotlight-card:hover::before { opacity: 1; }
    .corner-tick { position: absolute; width: 12px; height: 12px; border-color: var(--line-strong); border-style: solid; pointer-events: none; }
    .corner-tick.tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
    .corner-tick.tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
    .corner-tick.bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
    .corner-tick.br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

    .medal {
      width: 46px; height: 46px; flex: 0 0 auto; display: grid; place-items: center;
      font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; color: var(--sky-soft);
      border: 1px solid var(--line-strong); border-radius: 12px; background: rgba(56, 189, 248, .07);
    }
    .medal.emerald { color: #5fe3a1; border-color: rgba(52, 211, 153, .35); background: rgba(14, 135, 61, .1); }
    .medal.crimson { color: #ff9b94; border-color: rgba(240, 128, 128, .35); background: rgba(201, 26, 26, .1); }

    .chip {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .34rem .7rem; border-radius: 999px; font-size: .72rem; font-weight: 600;
      border: 1px solid var(--line); color: var(--body); background: rgba(14, 32, 60, .45);
      font-family: var(--font-ui); letter-spacing: .04em; white-space: nowrap;
    }
    .chip .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--sky); }
    .chip.gold { color: var(--gold-soft); border-color: var(--line-strong); }
    .chip.emerald { color: #5fe3a1; border-color: rgba(52, 211, 153, .3); }
    .chip.emerald .dot { background: #34d399; }
    .chip-live { color: var(--mint); border-color: rgba(125, 226, 195, .3); }
    .chip-live .dot { background: var(--mint); animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
      font-family: var(--font-ui); font-weight: 600; font-size: .83rem; letter-spacing: .06em;
      text-transform: uppercase; padding: .82rem 1.6rem; border-radius: 999px;
      border: 1px solid transparent; transition: transform .35s var(--ease), box-shadow .35s var(--ease), background-color .3s, border-color .3s, color .3s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.98); }
    .btn-gold {
      background: linear-gradient(180deg, #E9CC6B, #D4AF37 55%, #B8952B);
      color: #241a02; box-shadow: 0 10px 28px rgba(212, 175, 55, .22), inset 0 1px 0 rgba(255, 255, 255, .45);
    }
    .btn-gold:hover { box-shadow: 0 14px 34px rgba(212, 175, 55, .34); transform: translateY(-2px); color: #1d1500; }
    .btn-crimson {
      background: linear-gradient(180deg, #d82929, #B31414 60%, #8f0f0f);
      color: #fff; box-shadow: 0 10px 26px rgba(201, 26, 26, .25), inset 0 1px 0 rgba(255, 255, 255, .18);
    }
    .btn-crimson:hover { box-shadow: 0 14px 32px rgba(201, 26, 26, .4); transform: translateY(-2px); color: #fff; }
    .btn-glass {
      background: rgba(14, 32, 60, .4); color: var(--ink);
      border-color: var(--line-strong); backdrop-filter: blur(10px);
    }
    .btn-glass:hover { background: rgba(56, 189, 248, .12); color: var(--sky-soft); border-color: var(--sky); transform: translateY(-2px); }
    .btn-emerald {
      background: linear-gradient(180deg, #16a85a, #0E873D 60%, #0a672f);
      color: #04130a; box-shadow: 0 10px 26px rgba(14, 135, 61, .25), inset 0 1px 0 rgba(255, 255, 255, .3);
    }
    .btn-emerald:hover { box-shadow: 0 14px 32px rgba(14, 135, 61, .38); transform: translateY(-2px); color: #030f07; }
    .btn-sm { padding: .6rem 1.15rem; font-size: .74rem; }
    .btn-lg { padding: 1rem 2rem; font-size: .9rem; }
    .link-arrow { font-family: var(--font-ui); font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sky-soft); display: inline-flex; align-items: center; gap: .4rem; }
    .link-arrow::after { content: "→"; transition: transform .3s var(--ease); }
    .link-arrow:hover::after { transform: translateX(4px); }

    /* ---------- Scroll progress hairline ---------- */
    /* Scroll progress hairline lives inside the sticky header (never fixed on body) */
    #scrollProgressBar { position: absolute; top: 0; left: 0; width: 100%; height: 2px; display: block; transform: scaleX(0); transform-origin: 0 50%; background: linear-gradient(90deg, var(--sky-deep), var(--sky), #BAE6FD); box-shadow: 0 0 12px rgba(56, 189, 248, .6); z-index: 1; pointer-events: none; }

    .mnav-btn:hover { color: var(--sky-soft); border-color: var(--line-strong); }
    .mnav-btn.active { background: linear-gradient(180deg, #4FD3FF, var(--sky) 55%, var(--sky-deep)); color: #04131f; border-color: transparent; }
    @keyframes menuIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .mobile-menu { animation: menuIn .3s var(--ease); }

    /* ---------- Cinematic portal ---------- */
    .cinematic {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 1.6rem; gap: 1rem;
      background: radial-gradient(120% 90% at 50% 0%, #0b1c38 0%, #040a16 58%);
      overflow: hidden; transition: opacity .65s cubic-bezier(.16, 1, .3, 1), transform .65s cubic-bezier(.16, 1, .3, 1);
    }
    .cinematic::before {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(42% 34% at 50% 42%, rgba(212, 175, 55, .13), transparent 70%),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(212, 175, 55, .025) 3px 4px);
      pointer-events: none;
    }
    .portal-orb { position: relative; width: clamp(120px, 24vw, 178px); aspect-ratio: 1; display: grid; place-items: center; }
    .portal-orb::before, .portal-orb::after {
      content: ""; position: absolute; inset: -18%; border-radius: 50%;
      border: 1px solid var(--line-strong);
    }
    .portal-orb::after { inset: -34%; border-style: dashed; border-color: rgba(212, 175, 55, .22); animation: spin 26s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .portal-orb img { width: 72%; filter: drop-shadow(0 12px 36px rgba(212, 175, 55, .3)); }
    .portal-status { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .3em; color: var(--mint); text-transform: uppercase; }
    .portal-copy { max-width: 34rem; }
    .portal-title { font-family: var(--font-display); font-size: clamp(2.2rem, 6.5vw, 4rem); color: var(--ink); line-height: 1.1; }
    .portal-cta {
      display: inline-flex; align-items: center; gap: .7rem;
      font-family: var(--font-ui); font-weight: 700; font-size: .82rem; letter-spacing: .18em; text-transform: uppercase;
      color: #241a02; background: linear-gradient(180deg, #E9CC6B, #D4AF37 55%, #B8952B);
      padding: .95rem 2rem; border: 0; border-radius: 999px;
      box-shadow: 0 14px 40px rgba(212, 175, 55, .3), inset 0 1px 0 rgba(255, 255, 255, .5);
      transition: transform .35s var(--ease), box-shadow .35s var(--ease);
    }
    .portal-cta:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 18px 50px rgba(212, 175, 55, .45); }
    .portal-hint { font-family: var(--font-mono); font-size: .66rem; letter-spacing: .24em; color: var(--muted); }

    /* ---------- Page views ---------- */
    .page-view { display: none; }
    .page-view.active { display: block; animation: pageIn .5s var(--ease); }
    @keyframes pageIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .page-view.active { animation: none; } }

    /* ---------- Home hero ---------- */
    .hero-band { position: relative; padding-block: clamp(2.6rem, 6vw, 5rem) clamp(2.2rem, 5vw, 4rem); overflow: hidden; }
    .hero-band::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(58% 46% at 18% 8%, rgba(14, 32, 60, .75), transparent 65%),
                  radial-gradient(40% 40% at 88% 20%, rgba(56, 189, 248, .12), transparent 70%);
    }
    .hero-grid { position: relative; display: grid; gap: clamp(2rem, 5vw, 3.4rem); grid-template-columns: 1fr; align-items: center; }
    .hero-grid > * { min-width: 0; }
    @media (min-width: 1024px) { .hero-grid { grid-template-columns: 1.06fr .94fr; } }
    .hero-copy .lead { margin-top: 1.1rem; max-width: 34rem; }
    .hero-ctas { display: flex; flex-wrap: wrap; gap: .8rem; margin-top: 1.8rem; }
    .trust-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.6rem; }
    #galaxyCanvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .55; }

    .hero-frame { position: relative; padding: clamp(.55rem, 1.4vw, .85rem); }
    .hero-frame::before {
      content: ""; position: absolute; inset: 0; border-radius: 20px;
      border: 1px solid var(--line-strong);
      background: linear-gradient(160deg, rgba(14, 32, 60, .5), rgba(4, 10, 22, .65));
    }
    .hero-frame::after {
      content: ""; position: absolute; inset: 6px; border-radius: 15px;
      border: 1px dashed rgba(127, 212, 252, .28); pointer-events: none;
    }
    .hero-frame > * { position: relative; z-index: 1; }
    .hero-visual { border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 2.9; background: #060d1d; }
    .hero-visual img { width: 100%; height: 100%; object-fit: cover; }
    .tele {
      margin-top: .55rem; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(3, 7, 16, .85); padding: .8rem .95rem;
      font-family: var(--font-mono); font-size: .68rem; line-height: 1.75; color: var(--body);
      min-height: 6.2em; max-height: 6.9em; overflow: hidden; min-width: 0;
    }
    .tele-head { display: flex; justify-content: space-between; gap: 1rem; font-size: .6rem; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: .45rem; margin-bottom: .45rem; }
    .tele p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tele .tm { color: var(--muted); } .tele .ta { color: var(--amber); } .tele .te { color: #34d399; } .tele .tc { color: var(--mint); } .tele .th { color: var(--sky-soft); }
    @media (max-width: 700px) {
      .btn { white-space: normal; text-align: center; padding-inline: 1.1rem; }
      .tele { min-height: 0; max-height: 13em; }
      .tele p { white-space: normal; overflow: visible; }
    }

    /* ---------- Verified credentials wall ---------- */
    .cert-grid { display: grid; gap: 1.1rem; grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 760px) { .cert-grid { grid-template-columns: 1fr; } }
    .cert-card { display: flex; flex-direction: column; gap: .75rem; }
    .cert-figure { background: #fff; border-radius: 14px; padding: .7rem .7rem .8rem; box-shadow: 0 20px 44px rgba(2, 6, 16, .5); }
    .cert-figure img { width: 100%; height: auto; border-radius: 8px; display: block; }
    .cert-cap { display: flex; flex-direction: column; gap: .25rem; padding-inline: .2rem; }
    .cert-issuer { font-family: var(--font-mono); font-size: .6rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--sky); }
    .cert-cap b { font-family: var(--font-ui); font-size: .95rem; font-weight: 700; color: var(--ink); letter-spacing: .01em; line-height: 1.35; }
    .cert-cap small { font-size: .74rem; color: var(--muted); }
    .cert-verify { font-family: var(--font-ui); font-size: .74rem; font-weight: 600; color: var(--sky-soft); display: inline-flex; align-items: center; gap: .35rem; }
    .cert-verify:hover { color: var(--ink); }
    .cert-sheet { border: 1px solid var(--line-strong); border-radius: 14px; background: linear-gradient(160deg, rgba(56, 189, 248, .10), rgba(4, 10, 22, .7)); padding: 1.1rem 1.15rem; display: flex; flex-direction: column; gap: .6rem; flex: 1; }
    .cert-sheet .big { font-family: var(--font-ui); font-size: clamp(2rem, 4vw, 2.6rem); font-weight: 700; color: var(--sky-soft); line-height: 1; }
    .cert-sheet-title { font-family: var(--font-display); font-size: 1.12rem; font-weight: 600; color: var(--ink); }
    .path-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .2rem; }
    .path-chips span { font-family: var(--font-ui); font-size: .62rem; font-weight: 600; letter-spacing: .04em; color: var(--sky-soft); background: rgba(56, 189, 248, .09); border: 1px solid var(--line); border-radius: 999px; padding: .28rem .6rem; }
    .cert-id { font-family: var(--font-mono); font-size: .66rem; color: var(--muted); }
    .cert-strip { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem .6rem; padding: .9rem 1.05rem; }
    .cert-strip .mini-tag { font-family: var(--font-ui); font-size: .68rem; font-weight: 600; letter-spacing: .05em; color: var(--sky-soft); border: 1px solid var(--line-strong); background: rgba(56, 189, 248, .07); border-radius: 999px; padding: .38rem .8rem; display: inline-flex; align-items: center; gap: .4rem; }
    .cert-strip .mini-tag::before { content: "✔"; color: var(--sky); font-size: .7rem; }

    /* ---------- Stats ---------- */
    .stat-band { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; grid-template-columns: 1fr; }
    @media (min-width: 760px) { .stat-band { grid-template-columns: repeat(3, 1fr); } }
    .stat { background: linear-gradient(170deg, rgba(14, 32, 60, .55), rgba(4, 10, 22, .8)); padding: 1.3rem 1.2rem 1.15rem; text-align: center; }
    .kpi-num { font-family: var(--font-ui); font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 700; color: var(--sky-soft); letter-spacing: -.01em; line-height: 1; }
    .kpi-cap { margin-top: .45rem; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

    /* ---------- Capability carousel ---------- */
    .caro { display: grid; gap: 1rem; grid-template-columns: 1fr; align-items: stretch; }
    @media (min-width: 900px) { .caro { grid-template-columns: .9fr 1.1fr; } }
    .caro-steps { display: flex; gap: .4rem; margin-top: 1rem; }
    .slide-dot { height: 3px; border-radius: 99px; background: rgba(212, 175, 55, .25); border: 0; padding: 0; transition: background-color .4s, width .4s var(--ease); width: 8px; cursor: pointer; }
    .slide-dot.on { width: 30px; background: var(--sky); }
    .slide-progress { height: 2px; background: rgba(212, 175, 55, .2); border-radius: 99px; overflow: hidden; margin-top: .8rem; }
    #slideProgress { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--sky-deep), var(--sky-soft)); transition: width 6s linear; }

    /* ---------- The Loop (engine phases) ---------- */
    .loop-wrap { display: grid; gap: 1.4rem; grid-template-columns: 1fr; }
    @media (min-width: 980px) { .loop-wrap { grid-template-columns: 300px 1fr; align-items: start; } }
    .loop-mono {
      border: 1px solid var(--line); border-radius: 16px; background: rgba(3, 7, 16, .8);
      font-family: var(--font-mono); font-size: .7rem; padding: 1rem 1.1rem 1.2rem;
    }
    .loop-headrow { display: flex; align-items: center; justify-content: space-between; gap: .6rem; font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: .6rem; }
    #crmStageLabel { display: block; color: var(--sky-soft); font-weight: 500; margin-top: .5rem; font-size: .74rem; letter-spacing: .08em; }
    .ctrl { font-family: var(--font-ui); font-size: .66rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--body); background: rgba(14, 32, 60, .5); border: 1px solid var(--line); border-radius: 999px; padding: .4rem .85rem; transition: border-color .25s, color .25s; }
    .ctrl:hover { color: var(--sky-soft); border-color: var(--line-strong); }
    .loop-steps { display: grid; gap: .8rem; grid-template-columns: 1fr; position: relative; }
    @media (min-width: 640px) { .loop-steps { grid-template-columns: 1fr 1fr; } }
    .loop-card {
      position: relative; border: 1px solid var(--line); border-radius: 16px; padding: 1rem 1.1rem;
      background: rgba(8, 20, 39, .35); transition: border-color .45s var(--ease), background-color .45s, transform .45s var(--ease), opacity .45s; opacity: .68;
    }
    .loop-card.active { opacity: 1; border-color: var(--sky); background: rgba(14, 32, 60, .62); transform: translateY(-2px); box-shadow: 0 16px 40px rgba(2, 6, 16, .5), 0 0 24px rgba(56, 189, 248, .09); }
    .loop-num { font-family: var(--font-mono); font-size: .64rem; letter-spacing: .24em; color: var(--muted); }
    .loop-card.active .loop-num { color: var(--sky); }
    .loop-card h4 { margin-top: .25rem; font-size: .95rem; }
    .loop-card p { margin-top: .3rem; font-size: .8rem; color: var(--body); line-height: 1.55; }
    .loop-meta { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; }
    .pill-dots { display: flex; gap: .45rem; margin-top: .9rem; justify-content: center; }
    .pill-dot { width: 30px; height: 3px; border-radius: 99px; border: 0; padding: 0; background: rgba(212, 175, 55, .22); cursor: pointer; transition: background-color .4s; }
    .pill-dot.active { background: var(--sky); }
    .laser { position: relative; height: 3px; margin: .7rem 0 .25rem; background: rgba(212, 175, 55, .14); border-radius: 99px; overflow: hidden; }
    #scrollySpineLaser { position: absolute; inset: 0; width: 0%; background: linear-gradient(90deg, var(--sky-deep), var(--sky-soft)); border-radius: 99px; box-shadow: 0 0 10px rgba(56, 189, 248, .55); transition: width .55s var(--ease); }

    /* ---------- KNR spotlight ---------- */
    .knr-tabs { display: inline-flex; gap: .35rem; padding: .3rem; border: 1px solid var(--line); border-radius: 999px; background: rgba(8, 20, 39, .55); }
    .knr-tab { font-family: var(--font-ui); font-size: .7rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: .5rem 1.05rem; transition: color .3s, box-shadow .3s; }
    .knr-tab.knr-on { color: #241a02; background: linear-gradient(180deg, #E9CC6B, #C9A32D); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4); }
    .knr-grid { display: grid; gap: 1.2rem; grid-template-columns: 1fr; margin-top: 1.3rem; }
    @media (min-width: 900px) { .knr-grid { grid-template-columns: 1.05fr .95fr; align-items: start; } }
    .chat-sim { border: 1px solid var(--line); border-radius: 16px; padding: 1rem; background: rgba(3, 7, 16, .7); }
    .chatline { max-width: 88%; border-radius: 14px; padding: .55rem .8rem; font-size: .8rem; line-height: 1.5; margin-bottom: .55rem; }
    .chatline.user { margin-left: auto; background: linear-gradient(180deg, #E9CC6B, #C9A32D); color: #241a02; border-bottom-right-radius: 4px; }
    .chatline.bot { background: rgba(14, 32, 60, .65); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .knr-chips { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .6rem; }
    .knr-chip { font-family: var(--font-ui); font-size: .7rem; font-weight: 600; color: var(--sky-soft); background: rgba(56, 189, 248, .08); border: 1px solid var(--line); border-radius: 999px; padding: .38rem .8rem; transition: border-color .25s, background-color .25s; }
    .knr-chip:hover { border-color: var(--sky); background: rgba(56, 189, 248, .14); }
    .knr-answer { margin-top: .7rem; border-left: 2px solid var(--sky); padding: .45rem 0 .45rem .8rem; font-size: .8rem; color: var(--ink); min-height: 2.4em; }
    .corridor-table { width: 100%; border-collapse: collapse; font-family: var(--font-ui); font-size: .8rem; }
    .corridor-table caption { text-align: left; font-family: var(--font-mono); font-size: .62rem; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; padding-bottom: .6rem; }
    .corridor-table th { text-align: left; font-weight: 600; color: var(--muted); text-transform: uppercase; font-size: .64rem; letter-spacing: .14em; padding: .5rem .6rem; border-bottom: 1px solid var(--line); }
    .corridor-table td { padding: .68rem .6rem; border-bottom: 1px solid rgba(212, 175, 55, .09); color: var(--body); }
    .corridor-table td:last-child { text-align: right; font-family: var(--font-mono); color: var(--gold-soft); }
    .case-strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-top: 1.2rem; }
    @media (min-width: 760px) { .case-strip { grid-template-columns: repeat(4, 1fr); } }
    .case-strip .stat { padding: 1rem .8rem; }

    /* ---------- Architecture rail ---------- */
    .arch-tabs { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.2rem; }
    .arch-tab {
      font-family: var(--font-ui); font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); background: rgba(8, 20, 39, .5); border: 1px solid var(--line);
      border-radius: 999px; padding: .5rem 1rem; transition: border-color .3s, color .3s, box-shadow .3s;
    }
    .arch-tab[aria-selected="true"] { color: #241a02; background: linear-gradient(180deg, #E9CC6B, #C9A32D); border-color: transparent; }
    .arch-flow { display: flex; align-items: center; gap: .2rem; margin: 1rem 0 1.3rem; }
    .arch-node {
      flex: 1; display: grid; place-items: center; gap: .2rem; padding: .55rem .2rem; border-radius: 12px;
      border: 1px solid var(--line); background: rgba(8, 20, 39, .4); transition: border-color .5s, opacity .5s;
      font-family: var(--font-mono); font-size: .6rem; letter-spacing: .16em; color: var(--muted); text-align: center;
    }
    .arch-node.act { border-color: var(--sky); color: var(--sky-soft); background: rgba(56, 189, 248, .09); }
    .arch-arrow { color: rgba(212, 175, 55, .4); font-size: .7rem; }
    .arch-detail { border-left: 2px solid var(--sky); padding-left: 1rem; padding-block: .2rem .5rem; margin: .2rem 0 1rem; }
    .arch-detail h4 { font-family: var(--font-display); font-size: 1.05rem; color: var(--ink); }
    .arch-detail p { font-size: .82rem; margin-top: .3rem; }
    .arch-list { margin: .55rem 0 0; padding: 0; list-style: none; display: grid; gap: .35rem; }
    .arch-list li { font-size: .78rem; color: var(--body); }
    .arch-list li::before { content: "◆"; color: var(--sky-soft); font-size: .55rem; margin-right: .5rem; }

    /* ---------- Services ---------- */
    .svc-grid { display: grid; gap: .9rem; grid-template-columns: 1fr; }
    @media (min-width: 620px) { .svc-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1080px) { .svc-grid { grid-template-columns: repeat(4, 1fr); } }
    .svc-card { display: flex; flex-direction: column; gap: .8rem; }
    .svc-letter { font-family: var(--font-mono); font-size: .62rem; letter-spacing: .22em; color: var(--sky); }
    .svc-card h4 { font-family: var(--font-display); font-size: 1.02rem; color: var(--ink); font-weight: 600; }
    .svc-card p { font-size: .78rem; color: var(--body); line-height: 1.55; flex: 1; }
    .svc-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .svc-tags { display: flex; flex-wrap: wrap; gap: .3rem; }
    .tag { font-family: var(--font-mono); font-size: .58rem; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: .14rem .4rem; white-space: nowrap; }

    /* ---------- Portfolio ---------- */
    .filter-bar { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 1.3rem; }
    .dir-input, .dir-select {
      background: rgba(8, 20, 39, .6); border: 1px solid var(--line); color: var(--ink);
      border-radius: 12px; padding: .6rem .9rem; font-family: var(--font-ui); font-size: .8rem;
      transition: border-color .25s; min-width: 0;
    }
    .dir-input::placeholder { color: var(--muted); }
    .dir-input:focus, .dir-select:focus { border-color: var(--sky); outline: none; }
    .dir-select { color-scheme: dark; }
    .proj-grid { display: grid; gap: 1rem; grid-template-columns: 1fr; }
    @media (min-width: 680px) { .proj-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1080px) { .proj-grid { grid-template-columns: repeat(3, 1fr); } }
    .proj-card { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
    .proj-media { aspect-ratio: 16/10; overflow: hidden; border-bottom: 1px solid var(--line); background: linear-gradient(160deg, #0d1c38, #060d1d); }
    .proj-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease), opacity .45s; }
    .proj-card:hover .proj-media img { transform: scale(1.045); }
    .proj-body { padding: 1.05rem 1.15rem 1.2rem; display: flex; flex-direction: column; gap: .55rem; flex: 1; }
    .proj-body h4 { font-family: var(--font-display); font-size: 1.05rem; color: var(--ink); font-weight: 600; line-height: 1.25; }
    .proj-body p { font-size: .79rem; color: var(--body); flex: 1; }
    .status-row { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
    .status-chip { font-family: var(--font-ui); font-size: .6rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; border-radius: 999px; padding: .26rem .6rem; border: 1px solid var(--line); }
    .status-chip.st-live { color: #5fe3a1; border-color: rgba(52, 211, 153, .4); background: rgba(14, 135, 61, .12); }
    .status-chip.st-proto { color: var(--gold-soft); border-color: var(--line-strong); background: rgba(212, 175, 55, .08); }
    .status-chip.st-repo { color: var(--sky); border-color: rgba(140, 184, 255, .35); background: rgba(140, 184, 255, .08); }

    /* ---------- Stack ---------- */
    .stack-tiers { display: grid; gap: .9rem; grid-template-columns: 1fr; }
    @media (min-width: 700px) { .stack-tiers { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1120px) { .stack-tiers { grid-template-columns: repeat(3, 1fr); } }
    .stack-tier { border: 1px solid var(--line); border-radius: 16px; padding: 1.05rem 1.1rem; background: rgba(8, 20, 39, .4); transition: border-color .5s var(--ease), transform .5s var(--ease); }
    .stack-tier:hover { border-color: var(--line-strong); transform: translateY(-3px); }
    .stack-cat { font-family: var(--font-ui); font-size: .8rem; font-weight: 700; color: var(--sky-soft); letter-spacing: .03em; }
