    /* ---------- Cyber SFX synthesizer (opt-in; stays silent by default) ---------- */
    var audioCtx = null;
    var sfxEnabled = false;
    function getAudioContext() {
      try {
        var AudioCtor = (typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext)) || null;
        if (!AudioCtor) return null;
        if (!audioCtx) audioCtx = new AudioCtor();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      } catch (e) { return null; }
    }
    function playCyberSfx(type) {
      if (!sfxEnabled) return;
      try {
        var ctx = getAudioContext();
        if (!ctx) return;
        var now = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        var map = { click: [880, 'square', .03, .05], portal: [220, 'sawtooth', .18, .3], nav: [660, 'sine', .04, .08], tick: [1200, 'sine', .02, .04] };
        var c = map[type] || map.click;
        osc.type = c[1];
        osc.frequency.setValueAtTime(c[0], now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(80, c[0] * .55), now + c[3]);
        gain.gain.setValueAtTime(c[2], now);
        gain.gain.exponentialRampToValueAtTime(.0001, now + c[3]);
        osc.start(now); osc.stop(now + c[3] + .02);
      } catch (e) {}
    }
    function toggleCyberSfx() { sfxEnabled = !sfxEnabled; playCyberSfx('click'); }

        document.querySelectorAll('.nav-btn').forEach(function (btn) {

          if (active) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
        });
        document.querySelectorAll('.mnav-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-mnav') === pageId);
        });
      } catch (e) {}
      try {
        if (window.location.hash !== '#' + pageId && window.location.hash !== '#page-' + pageId) {
          history.replaceState(null, null, '#' + pageId);
        }
      } catch (e) {}
      var rm = false;
      try { rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      try { window.scrollTo({ top: 0, behavior: rm ? 'auto' : 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
    }
    function handleHashNav() {
      var h = (window.location.hash || '').replace(/^#page-|^#/, '').trim();
      if (!h) return;
      if (document.getElementById('page-' + h)) { switchPage(h); return; }
      if (ANCHOR_PAGE[h]) {
        switchPage(ANCHOR_PAGE[h]);
        setTimeout(function () { jumpToEl(h); }, 60);

      var nameEl = document.getElementById('clientName');

      var goalEl = document.getElementById('clientGoal');
      var svcEl = document.getElementById('clientService');
      var name = nameEl ? nameEl.value.trim() : '';
      var phone = phoneEl ? phoneEl.value.trim() : '';
      var service = svcEl ? svcEl.value : '';
      var goal = goalEl ? goalEl.value.trim() : '';
      var phoneDigits = phone.replace(/\D/g, '');
      var valid = Boolean(name.length >= 2 && phoneDigits.length >= 8 && phoneDigits.length <= 15 && goal.length >= 10);
      return {
        valid: valid,
        text: 'Hello Rahul (BUDDY AI PARTNERS),\n\n*Name/Company:* ' + name + '\n*Phone:* ' + phone + '\n*Service:* ' + service + '\n*Project Brief:* ' + goal

    }

        el.classList.toggle('ok', !isError);
        el.classList.toggle('err', !!isError);

    }
    function handleContactSubmit(e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      var brief = buildBriefMessage();
      if (!brief.valid) {
        showFeedback('Enter your name (2+ chars), a valid phone (8-15 digits), and a brief of at least 10 characters before sending.', true);
        return;
      }
      var cleanNumber = String(WHATSAPP_NUMBER).replace(/[^0-9]/g, '');
      var waUrl = cleanNumber
        ? 'https://wa.me/' + cleanNumber + '?text=' + encodeURIComponent(brief.text)
        : 'https://wa.me/?text=' + encodeURIComponent(brief.text);
      showFeedback(cleanNumber
        ? 'Opening WhatsApp with your brief prefilled for BUDDY AI PARTNERS.'
        : 'WhatsApp opens with your brief prefilled. No business WhatsApp number is configured yet — choose the recipient before sending.', false);
      try { window.open(waUrl, '_blank', 'noopener,noreferrer'); } catch (e) {}
    }
    function copyBriefToClipboard() {
      var brief = buildBriefMessage();
      if (!brief.valid) {
        showFeedback('Please complete name, valid phone and a 10+ character brief first — nothing was copied or discarded.', true);
        return;
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(brief.text).then(function () {
            showFeedback('Project brief copied. Paste it into WhatsApp or Instagram DM.', false);
          }).catch(function () { showFeedback('Copy failed. Please manually select and copy your brief text.', true); });
        } else {
          showFeedback('Copy is not available in this browser. Please send via WhatsApp instead.', true);
        }

                if (progress < 1) requestAnimationFrame(tick);

        var brief = 'Hi Rahul — Buddy AI preview brief:%0A• Goal: ' + BAI.goal + '%0A• Budget: ' + BAI.budget + '%0A• Timeline: ' + BAI.timeline + '%0A• Name: ' + BAI.name + '%0A• Preferred channel: ' + BAI.channel + '%0A• Meeting slot: ' + BAI.slot;

    }
    function baiBriefText() {
      return 'Hi Rahul — Buddy AI preview brief:\n• Goal: ' + BAI.goal + '\n• Budget: ' + BAI.budget + '\n• Timeline: ' + BAI.timeline + '\n• Name: ' + BAI.name + '\n• Preferred channel: ' + BAI.channel + '\n• Meeting slot: ' + BAI.slot;
    }
    function baiToast(txt) {
      try { var t = baiEl('baiToast'); if (!t) return; t.textContent = txt; t.classList.add('bai-show'); setTimeout(function () { t.classList.remove('bai-show'); }, 2400); } catch (e) {}
    }
    function baiCopyBrief() {
      try {
        var txt = baiBriefText();
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt); baiToast('Brief copied — paste it in the DM ✓'); }
        else baiToast('Copy not available here — select the brief text manually.');
      } catch (e) {}
    }
    function baiHandoff(kind) {
      baiCopyBrief();
      try {
        if (kind === 'tg') window.open('https://t.me/917328089908', '_blank', 'noopener');
        if (kind === 'ig') window.open('https://instagram.com/rahul_kr_dhal', '_blank', 'noopener');

    function baiPick(i) {
      var c = baiEl('baiChips'); if (!c) return;
      var btns = c.querySelectorAll ? c.querySelectorAll('.bai-chip') : [];
      var label = null;
      try { if (btns && btns.length && btns[i]) label = btns[i].textContent; } catch (e) {}

    function baiSend() {
      var inp = baiEl('baiInput'); if (!inp) return;
      var txt = (inp.value || '').trim(); if (!txt) return;
      inp.value = '';
      baiMsg(txt.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'), 'user');
      if (BAI.awaitingName) {
        BAI.name = txt; BAI.awaitingName = false; baiBriefRender();
        baiBot('Thanks, ' + txt + '. Which channel should the brief go through?', ['WhatsApp', 'Telegram', 'Instagram']);
        BAI.step = 3;
        return;

      if (BAI.endpoint) { baiLive(txt); return; }
      baiBot('Noted: “' + txt + '”. In live mode (n8n connected) I answer free-flow questions and search the web. In this preview I log your words and keep the guided flow — tap an option below or keep typing.', ['Restart the preview']);

    function baiAdvance(label) {
      if (label === 'Restart the preview') { baiReset(); return; }
      switch (BAI.step) {
        case 0:

          baiBot(BAI_RECS[label] || BAI_RECS['Talk to Rahul'], null, ['🔍 Searching context for: ' + label + '…', '🧠 Drafting a recommendation…', '✅ Ready — here is my take:']);
          baiBot('What monthly budget are you comfortable with?', ['< ₹15k / mo', '₹15–25k / mo', '₹25k+ or project-based']);
          BAI.step = 1; break;
        case 1:
          BAI.budget = label; baiBriefRender();
          baiBot('Got it. What timeline are we working with?', ['ASAP', 'This month', 'Just researching']);
          BAI.step = 2; break;
        case 2:
          BAI.timeline = label; baiBriefRender();

          BAI.step = 3; BAI.awaitingName = true; break;
        case 3:
          BAI.channel = label; baiBriefRender();
          baiBot('And when should Rahul call you?', ['Tomorrow · 11:00 AM', 'Tomorrow · 6:00 PM', 'This weekend']);
          BAI.step = 4; break;
        case 4:
          BAI.slot = label; baiBriefRender();
          baiBot('All set, ' + BAI.name + '. Your brief is ready in the panel → send it through <b>' + BAI.channel + '</b> (WhatsApp opens prefilled; Telegram &amp; Instagram copy the brief to paste). Rahul confirms the ' + label + ' slot with the full context.', []);
          BAI.step = 5; break;
        default:
          baiBot('Use the handoff buttons in the brief panel to send it, or tap below to start over.', ['Restart the preview']);
      }
    }
    function baiReset() {
      BAI.step = 0; BAI.goal = ''; BAI.budget = ''; BAI.timeline = ''; BAI.name = ''; BAI.channel = ''; BAI.slot = ''; BAI.awaitingName = false;

    /* ---------- 16. Engineering lab filter (portfolio) ---------- */
    function wireLabFilter() {
      try {

        if (!s || !f) return;
        function run() {

    /* ---------- 17. Gold quantum-mesh canvas (decorative, no tracking) ---------- */
    var canvas = document.getElementById('galaxyCanvas');
    var ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
    var prefersReducedMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
    var stars = [], shockwaves = [];
    var sceneWidth = 0, sceneHeight = 0, sceneRatio = 1, animationFrame = 0;
    var pointer = { x: -1000, y: -1000, active: false, radius: 140 };
    function resizeCanvas() {
      if (!canvas || !ctx) return;
      sceneWidth = window.innerWidth;
      sceneHeight = window.innerHeight;
      sceneRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(sceneWidth * sceneRatio);
      canvas.height = Math.round(sceneHeight * sceneRatio);
      canvas.style.width = sceneWidth + 'px';
      canvas.style.height = sceneHeight + 'px';
      ctx.setTransform(sceneRatio, 0, 0, sceneRatio, 0, 0);
      var count = sceneWidth < 600 ? 30 : (sceneWidth < 1024 ? 52 : 72);
      var palette = ['212,175,55', '246,226,122', '125,226,195', '200,212,227'];
      stars = Array.from({ length: count }, function () { return {
        x: Math.random() * sceneWidth,
        y: Math.random() * sceneHeight,
        vx: (Math.random() - .5) * (prefersReducedMotion ? 0 : .24),
        vy: (Math.random() - .5) * (prefersReducedMotion ? 0 : .24),
        r: Math.random() * 1.5 + .4,
        pulse: Math.random() * Math.PI * 2,
        color: palette[Math.floor(Math.random() * palette.length)]
      }; });
    }
    function animateGalaxy() {
      if (!canvas || !ctx || document.hidden) return;
      ctx.clearRect(0, 0, sceneWidth, sceneHeight);
      var maxDist = 120;
      for (var s = shockwaves.length - 1; s >= 0; s--) {
        var sw = shockwaves[s];
        sw.radius += 5.5;
        sw.alpha *= 0.94;
        if (sw.alpha < 0.02 || sw.radius >= sw.maxRadius) { shockwaves.splice(s, 1); continue; }
        ctx.strokeStyle = 'rgba(212,175,55,' + sw.alpha + ')';
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2); ctx.stroke();
        for (var i = 0; i < stars.length; i++) {
          var st = stars[i];
          var dx = st.x - sw.x; var dy = st.y - sw.y;
          var dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (Math.abs(dist - sw.radius) < 30 && dist > 1) {
            var push = (1 - Math.abs(dist - sw.radius) / 30) * 1.8;
            st.x += (dx / dist) * push; st.y += (dy / dist) * push;
          }
        }
      }
      for (var i2 = 0; i2 < stars.length; i2++) {
        var a = stars[i2];
        if (!prefersReducedMotion) {
          a.x += a.vx; a.y += a.vy; a.pulse += 0.02;
          if (pointer.active) {
            var pdx = a.x - pointer.x; var pdy = a.y - pointer.y;
            var pdist = Math.sqrt(pdx * pdx + pdy * pdy) || 1;
            if (pdist < pointer.radius && pdist > 1) {
              var force = (1 - pdist / pointer.radius) * 0.45;
              a.x += (pdx / pdist) * force; a.y += (pdy / pdist) * force;
              ctx.strokeStyle = 'rgba(212,175,55,' + ((1 - pdist / pointer.radius) * 0.28) + ')';
              ctx.lineWidth = 0.8;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
            }
          }
          if (a.x < -4) a.x = sceneWidth + 4;
          if (a.x > sceneWidth + 4) a.x = -4;
          if (a.y < -4) a.y = sceneHeight + 4;
          if (a.y > sceneHeight + 4) a.y = -4;
        }
        for (var j = i2 + 1; j < stars.length; j++) {
          var b = stars[j];
          var dx2 = a.x - b.x; var dy2 = a.y - b.y;
          var distance = Math.sqrt(dx2 * dx2 + dy2 * dy2);
          if (distance < maxDist) {
            var alpha = (1 - distance / maxDist) * 0.14;
            ctx.strokeStyle = 'rgba(246,226,122,' + alpha + ')';
            ctx.lineWidth = 0.7;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
        var currentRadius = prefersReducedMotion ? a.r : a.r + Math.sin(a.pulse) * 0.35;
        ctx.beginPath();
        ctx.arc(a.x, a.y, Math.max(0.2, currentRadius), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + a.color + ',0.85)';
        ctx.shadowColor = 'rgba(212,175,55,0.6)';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      if (!prefersReducedMotion) animationFrame = requestAnimationFrame(animateGalaxy);
    }
    if (canvas && ctx) {
      try {
        resizeCanvas();
        animateGalaxy();
        window.addEventListener('pointermove', function (e) { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; }, { passive: true });
        window.addEventListener('pointerleave', function () { pointer.active = false; pointer.x = -1000; pointer.y = -1000; }, { passive: true });
        window.addEventListener('pointerdown', function (e) {
          if (!prefersReducedMotion) shockwaves.push({ x: e.clientX, y: e.clientY, radius: 4, maxRadius: Math.min(sceneWidth, sceneHeight) * 0.4, alpha: 0.75 });
        }, { passive: true });
        window.addEventListener('resize', function () {
          resizeCanvas();
          if (!prefersReducedMotion) { cancelAnimationFrame(animationFrame); animateGalaxy(); }
          else { ctx.clearRect(0, 0, sceneWidth, sceneHeight); animateGalaxy(); }
        }, { passive: true });
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) cancelAnimationFrame(animationFrame);
          else animateGalaxy();
        });
      } catch (e) {}
    }

    /* ---------- 18. Spotlight cards + scroll progress ---------- */
    if (typeof window !== 'undefined') {
      try {
        window.addEventListener('mousemove', function (e) {
          try {
            var cards = document.querySelectorAll('.spotlight-card');
            for (var c = 0; c < cards.length; c++) {
              var el = cards[c];
              var rect = el.getBoundingClientRect();
              if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                el.style.setProperty('--mouse-x', (e.clientX - rect.left) + 'px');
                el.style.setProperty('--mouse-y', (e.clientY - rect.top) + 'px');
              }
            }
          } catch (err) {}
        }, { passive: true });
        window.addEventListener('scroll', function () {
          try {
            var bar = document.getElementById('scrollProgressBar');
            if (!bar) return;
            var h = document.documentElement || document.body;
            var st = window.scrollY || (h && h.scrollTop) || 0;
            var sh = (h && h.scrollHeight) || 1;
            var ch = window.innerHeight || 1;
            var pct = Math.min(Math.max(st / (sh - ch), 0), 1);
            bar.style.transform = 'scaleX(' + pct + ')';
          } catch (err) {}
        }, { passive: true });
      } catch (e) {}
    }

    /* ---------- 19. Scroll reveals ---------- */
    function initReveals() {
      try {
        var rm = false;
        try { rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
        if (rm || !('IntersectionObserver' in window)) {
          document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in-view'); });
          return;
        }
        var io = new IntersectionObserver(function (es) {
          es.forEach(function (en) {
            if (en.isIntersecting) { en.target.classList.add('in-view'); io.unobserve(en.target); }
          });
        }, { threshold: 0.12 });
        document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
      } catch (e) {}
    }

    /* ---------- 20. Copy-to-clipboard chips ---------- */
    function wireCopyButtons() {
      try {
        document.querySelectorAll('.copy-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var v = btn.getAttribute('data-copy') || '';
            var done = function () { baiToast('Copied: ' + v); };
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done, done);
              else baiToast('Copy unavailable — long-press to copy: ' + v);
            } catch (e) { baiToast('Copy unavailable — long-press to copy: ' + v); }
          });
        });
      } catch (e) {}
    }

    /* ---------- 21. Boot ---------- */
    function initApp() {
      try { renderSlide(0); } catch (e) {}
      try {
        document.querySelectorAll('.slide-dot').forEach(function (d, i) { d.addEventListener('click', function () { setSlide(i); }); });

        if (document.getElementById('roiIndustry')) calcROI();
      } catch (e) {}
      try { calcB2BROI(); } catch (e) {}
      try { wireEcoControls(); } catch (e) {}
      try { ovRender(); } catch (e) {}
      try {
        var rp = document.getElementById('heroReplay');
        if (rp) rp.addEventListener('click', function () {
          crmIdx = 0; crmWa = 12; crmSetWa(); crmPaused = false;
          var pb = document.getElementById('heroPause');
          if (pb) { pb.textContent = 'Pause'; pb.setAttribute('aria-pressed', 'false'); }
          crmPaint(); heroStart();
        });
      } catch (e) {}
      try {
        var pp = document.getElementById('heroPause');
        if (pp) pp.addEventListener('click', function () {
          crmPaused = !crmPaused;
          this.textContent = crmPaused ? 'Play' : 'Pause';
          this.setAttribute('aria-pressed', String(crmPaused));
        });
      } catch (e) {}
      try {
        for (var s2 = 0; s2 < 4; s2++) {
          (function (i) {
            var pill = document.getElementById('scrollyPill' + i);
            if (pill) pill.addEventListener('click', function () { scrollyJump(i); });
          })(s2);
        }
      } catch (e) {}
      try { heroStart(); } catch (e) {}
      try { initScrollytelling(); } catch (e) {}
      try { initCounterTickers(); } catch (e) {}
      try {
        var ar = document.getElementById('archReplay');
        if (ar) ar.addEventListener('click', function () { archAuto = true; archIdx = 0; archGo('capture'); archStart(); });
      } catch (e) {}
      try {
        document.querySelectorAll('.arch-tab').forEach(function (b) {
          b.addEventListener('click', function () {
            var k = b.getAttribute('data-arch');
            if (k) archPick(k);
          });
        });
      } catch (e) {}
      try { archPaint('capture'); } catch (e) {}
      try { archStart(); } catch (e) {}
      try {
        var ta = document.getElementById('knrTabAsk');
        if (ta) ta.addEventListener('click', function () { knrTab('ask'); });
        var tm = document.getElementById('knrTabMatrix');
        if (tm) tm.addEventListener('click', function () { knrTab('matrix'); });
      } catch (e) {}
      try { wireLabFilter(); } catch (e) {}
      try { initReveals(); } catch (e) {}
      try { wireCopyButtons(); } catch (e) {}
    }
    try {
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
      else initApp();
    } catch (e) { try { initApp(); } catch (e2) {} }
  </script>
